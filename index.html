.quiz-option.wrong { background: #f8d7da; border-color: var(--primary); }

.flashcard .back { display: none; }

textarea { width: 100%; min-height: 160px; padding: 0.8rem; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; font-size: 1rem; }

  mån: `De flesta är nog överens om att det råder bostadsbrist i Sveriges storstäder. Det är många som vill bo i storstaden och bostäderna räcker helt enkelt inte till för alla. Många ungdomar bor fortfarande kvar hos sina föräldrar och det är heller inte ovanligt att vara inneboende hos en kompis eller någon främmande person.\n\nByggföretagen bygger nya bostäder överallt, men ett problem verkar vara att byggandet inte går i takt med befolkningsökningen i städerna. Ett annat problem är att nyproducerade bostäder är dyra. Både priset på själva bostaden och boendekostnaderna är höga. De höga kostnaderna leder ofta till att fattiga ungdomar, studenter eller arbetslösa inte har råd att köpa sin egen bostad.\n\nBostadsbristen är som allra störst och mest påtaglig i innerstaden. Det är inte så konstigt, eftersom många av förklarliga skäl söker sig just dit. De flesta tycker att det är mer attraktivt att bo centralt än i förorterna, och möjligheterna att få jobb i innerstaden är dessutom större.\n\nHär kan du läsa om 30-årige Johan, som fortfarande bor hemma hos sina föräldrar.\n\n"Jag fyllde 30 år förra månaden och firade det med mina föräldrar i deras lilla lägenhet i Stockholm. Först åt vi en trerättersmiddag på en fin restaurang och sedan blev det kaffe och tårta hemma. Jag hade gärna velat bjuda alla mina kompisar men kunde tyvärr inte, på grund av min situation. Vi är så trångbodda att det helt enkelt inte finns plats för fler än vi i den lilla lägenheten. Jag är arbetslös och det är svårt att hitta ett jobb – och jag vet inte vad jag ska göra. Mina föräldrar har ingenting emot att jag bor hos dem, men jag skulle så gärna vilja ha en egen bostad och kunna bestämma över min vardag själv. Ibland tänker jag att det är bekvämt att bo hos mamma och pappa, men det är också genant och pinsamt för mig när jag ska svara på frågan: Vem bor du med?"`,
  tis: `Jag heter Kim och bor tillsammans med min flickvän i en liten tvåa på 46 kvadratmeter i Stockholm. Vi har alltid prioriterat ett bra läge, så därför har vi accepterat att vi blir lite trångbodda. Vi har nära till allt. Det tar fem minuter att ta sig till tunnelbanan och vi har en fin utsikt från vår balkong. Vi har också en livsmedelsbutik bara ett stenkast från vår lägenhet.\n\nNackdelen med att bo centralt är att det är dyrt. Vår lägenhet kostade 3,5 miljoner och vi har en månadsavgift på 8 320 kronor. En annan nackdel är att bostaden är så liten att vi inte kan bjuda hem alla våra kompisar, bara några få vänner då och då. Och när vi bjuder hem gäster kan vi ändå inte riktigt njuta av varandras sällskap. Det blir för trångt – och ljudnivån blir lätt för hög.\n\nI julas knackade en granne på dörren och klagade på att vi spelade musik på för hög volym. En annan gång var det en äldre dam som knackade på och frågade hur länge våra gäster tänkte stanna. Hon sa att hon hade svårt att sova på grund av allt oväsen. Så ibland önskar jag att vi bodde i en villa i stället, där inga grannar skulle störa oss och vi heller inte skulle störa någon annan.`
};

let currentWeek = 1;
let currentDay = 'mån';
let currentWord = '';
let score = parseInt(localStorage.getItem('sfi-score') || '0');

function init() {
  updateScore();
  renderWeekNav();
  renderDayTabs();
  renderContent();
}

function updateScore() {
  document.getElementById('scoreDisplay').textContent = `امتیاز: ${score}`;
  localStorage.setItem('sfi-score', score);
}

function addScore(points) {
  score += points;
  updateScore();
}

function renderWeekNav() {
  const nav = document.getElementById('weekNav');
  nav.innerHTML = '';
  for (let i = 1; i <= 9; i++) {
    const btn = document.createElement('button');
    btn.textContent = `Vecka ${i}`;
    btn.className = i === currentWeek ? 'active' : '';
    btn.onclick = () => { currentWeek = i; currentDay = 'mån'; renderWeekNav(); renderDayTabs(); renderContent(); };
    nav.appendChild(btn);
  }
}

function renderDayTabs() {
  const tabs = document.getElementById('dayTabs');
  tabs.innerHTML = '';
  const days = ['mån', 'tis', 'ons', 'tors', 'fre'];
  const labels = { mån: 'Mån', tis: 'Tis', ons: 'Ons', tors: 'Tors', fre: 'Fre' };
  days.forEach(d => {
    const btn = document.createElement('button');
    btn.textContent = labels[d];
    btn.className = d === currentDay ? 'active' : '';
    btn.onclick = () => { currentDay = d; renderDayTabs(); renderContent(); };
    tabs.appendChild(btn);
  });
}

function renderContent() {
  const content = document.getElementById('content');
  if (currentWeek !== 1) {
    content.innerHTML = `<div class="card"><h2>Vecka ${currentWeek}</h2><p>محتوای این هفته به زودی اضافه می‌شود. فعلاً هفته ۱ کاملاً آماده است.</p></div>`;
    return;
  }

  if (currentDay === 'mån' || currentDay === 'tis') {
    content.innerHTML = `
      <div class="card">
        <h2>${weeks[1].days[currentDay].title}</h2>
        <div class="progress"><div class="progress-bar" style="width: 35%"></div></div>
        <h3>لغات جدید <button class="btn secondary" style="float:right; font-size:0.8rem" onclick="startFlashcards()">فلش‌کارت</button></h3>
        <div id="vocabList"></div>
        <h3 style="margin-top:1.5rem">متن خواندن (روی هر کلمه کلیک کنید)</h3>
        <div class="reading-text" id="readingText"></div>
        <div style="margin-top:1rem">
          <a href="https://svenskadagfordag.se/ljud/ljud-svenska-dag-for-dag-d/vecka-1-d/" target="_blank" class="btn secondary">🎧 صوت رسمی</a>
          <button class="btn" onclick="startVocabQuiz()">تمرین لغات</button>
          <button class="btn success" onclick="startSentenceQuiz()">تمرین جمله</button>
        </div>
      </div>
    `;
    renderVocab();
    renderReading();
  } else if (currentDay === 'ons') {
    content.innerHTML = `
      <div class="card">
        <h2>Onsdag – Grammatik: Indefinita pronomen</h2>
        <p>Indefinita pronomen uttrycker någonting obestämt om personer eller saker.</p>
        <table class="grammar-table">
          <tr><th colspan="3">Attributiva</th><th colspan="2">Självständiga</th></tr>
          <tr><th>En</th><th>Ett</th><th>Plural</th><th>Personer</th><th>Saker</th></tr>
          <tr><td>någon</td><td>något</td><td>några</td><td>någon, några</td><td>något, någonting</td></tr>
          <tr><td>ingen</td><td>inget</td><td>inga</td><td>ingen, inga</td><td>inget, ingenting</td></tr>
          <tr><td>annan</td><td>annat</td><td>andra</td><td>annan, andra</td><td>annat</td></tr>
          <tr><td>all</td><td>allt</td><td>alla</td><td>alla</td><td>allt, allting</td></tr>
        </table>
        <h3>تمرین تعاملی</h3>
        <div id="grammarQuiz"></div>
      </div>
    `;
    renderGrammarQuiz();
  } else if (currentDay === 'tors') {
    content.innerHTML = `
      <div class="card">
        <h2>Torsdag – Skrivövning: Din bostad</h2>
        <div class="structure">
          <strong>ساختار یک نامه خوب:</strong>
          <ol>
            <li><b>Hälsning:</b> Hej / Hej [namn]! </li>
            <li><b>Inledning:</b> Tack för brevet + gratulera till flytten.</li>
            <li><b>Huvuddel:</b> Svara på frågorna (hur du flyttade, tips, för- och nackdelar med området).</li>
            <li><b>Avslutning:</b> Hoppas du trivs / Lycka till + Kram / Med vänlig hälsning.</li>
          </ol>
        </div>
        <div class="model-answer">
          <strong>نمونه قوی‌تر:</strong><br>
          Hej min vän!<br><br>
          Tack så mycket för ditt brev och stort grattis till den nya bostaden! När jag flyttade planerade jag allt noga i förväg. Jag packade sakerna i märkta lådor och bokade en flyttfirma. Mitt bästa tips är att kolla hur nära det är till kollektivtrafik och butiker innan du flyttar. Området är trevligt och lugnt, men det är ganska dyrt att bo här. Jag hoppas verkligen att du kommer att trivas lika bra som jag gör!<br><br>
          Kram<br>
          Din vän
        </div>
        <p>حالا خودتان بنویسید (حداقل ۸۰–۱۰۰ کلمه):</p>
        <textarea id="writingArea" placeholder="Skriv ditt svar här..."></textarea>
        <button class="btn" style="margin-top:0.8rem" onclick="checkWriting()">بررسی نوشته</button>
        <div id="writingFeedback" style="margin-top:1rem"></div>
      </div>
    `;
  } else if (currentDay === 'fre') {
    content.innerHTML = `
      <div class="card">
        <h2>Fredag – Hör- och talövningar</h2>
        <p>گوش دادن به صوت رسمی و پاسخ به سوالات کتاب.</p>
        <a href="https://svenskadagfordag.se/ljud/ljud-svenska-dag-for-dag-d/vecka-1-hoeroevningar-d/" target="_blank" class="btn">🎧 Hörövningar Vecka 1</a>
        <h3 style="margin-top:1.5rem">تمرین صحبت کردن</h3>
        <p>با همسرتان در مورد این موضوعات صحبت کنید (حداقل ۲ دقیقه هر کدام):</p>
        <ul>
          <li>Hur bor du just nu?</li>
          <li>Vad är viktigt för dig när du väljer bostad?</li>
          <li>Vad tycker du om bostadsbristen i Sverige?</li>
        </ul>
        <button class="btn success" onclick="addScore(10); alert('+10 امتیاز برای تمرین صحبت کردن!')">انجام دادم</button>
      </div>
    `;
  }
}

function renderVocab() {
  const list = document.getElementById('vocabList');
  if (!list) return;
  list.innerHTML = '';
  vocab[currentDay].forEach(v => {
    const div = document.createElement('div');
    div.className = 'vocab-item';
    div.innerHTML = `<div><div class="vocab-word">${v.sv}</div><div class="meanings">${v.fa} | ${v.en}</div></div><span>▶</span>`;
    div.onclick = () => showPopup(v);
    list.appendChild(div);
  });
}

function renderReading() {
  const el = document.getElementById('readingText');
  if (!el) return;
  const text = texts[currentDay];
  const words = text.split(/(\s+|[.,!?;:"“”])/);
  let html = '';
  words.forEach(part => {
    const clean = part.replace(/[.,!?;:"“”]/g, '').toLowerCase();
    if (clean && dictionary[clean]) {
      html += `<span class="word known" data-word="${clean}">${part}</span>`;
    } else if (part.trim()) {
      html += `<span class="word" data-word="${clean || part}">${part}</span>`;
    } else {
      html += part;
    }
  });
  el.innerHTML = html.replace(/\n/g, '<br>');
  el.querySelectorAll('.word').forEach(span => {
    span.onclick = (e) => {
      e.stopPropagation();
      const key = span.dataset.word;
      const entry = dictionary[key] || { fa: "(معنی در دیکشنری موجود نیست)", en: "(not in dictionary)", ipa: "", ex: "" };
      showPopup({ sv: key, ...entry });
    };
  });
}

function showPopup(v) {
  currentWord = v.sv;
  document.getElementById('popWord').textContent = v.sv;
  document.getElementById('popIpa').textContent = v.ipa || '';
  document.getElementById('popFa').textContent = v.fa || '';
  document.getElementById('popEn').textContent = v.en || '';
  document.getElementById('popEx').textContent = v.ex || '';
  document.getElementById('popup').classList.add('show');
  document.getElementById('overlay').classList.add('show');
}

function closePopup() {
  document.getElementById('popup').classList.remove('show');
  document.getElementById('overlay').classList.remove('show');
}

function speakWord() {
  if (!currentWord) return;
  const utter = new SpeechSynthesisUtterance(currentWord);
  utter.lang = 'sv-SE';
  utter.rate = 0.75;
  speechSynthesis.speak(utter);
}

let flashIndex = 0;
let flashCards = [];
function startFlashcards() {
  flashCards = [...vocab[currentDay]];
  flashIndex = 0;
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="card">
      <h2>فلش‌کارت - ${currentDay}</h2>
      <div class="flashcard" id="flashcard" onclick="flipCard()">
        <div class="front" id="flashFront"></div>
        <div class="back" id="flashBack"></div>
      </div>
      <div style="text-align:center; margin:0.5rem 0">
        <button class="btn" onclick="speakCurrentFlash()">🔊 تلفظ</button>
      </div>
      <div style="text-align:center">
        <button class="btn secondary" onclick="nextFlash(-1)">قبلی</button>
        <button class="btn" onclick="nextFlash(1)">بعدی</button>
        <button class="btn success" onclick="knowCard()">بلد بودم (+5)</button>
      </div>
      <p id="flashProgress" style="text-align:center; margin-top:1rem"></p>
      <button class="btn secondary" onclick="renderContent()">بازگشت</button>
    </div>
  `;
  showFlash();
}

function showFlash() {
  if (flashIndex >= flashCards.length) flashIndex = 0;
  if (flashIndex < 0) flashIndex = flashCards.length - 1;
  const v = flashCards[flashIndex];
  document.getElementById('flashFront').textContent = v.sv;
  document.getElementById('flashBack').innerHTML = `<strong>${v.fa}</strong><br>${v.en}<br><span class="ipa">${v.ipa || ''}</span><br><small>${v.ex}</small>`;
  document.getElementById('flashcard').classList.remove('flipped');
  document.getElementById('flashProgress').textContent = `${flashIndex + 1} / ${flashCards.length}`;
  currentWord = v.sv;
}

function flipCard() {
  document.getElementById('flashcard').classList.toggle('flipped');
}

function nextFlash(dir) {
  flashIndex += dir;
  showFlash();
}

function knowCard() {
  addScore(5);
  nextFlash(1);
}

function speakCurrentFlash() {
  speakWord();
}

function startVocabQuiz() {
  const items = vocab[currentDay];
  const q = items[Math.floor(Math.random() * items.length)];
  const options = [q];
  while (options.length < 4) {
    const rand = items[Math.floor(Math.random() * items.length)];
    if (!options.find(o => o.sv === rand.sv)) options.push(rand);
  }
  options.sort(() => Math.random() - 0.5);
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="card">
      <h2>تمرین لغات</h2>
      <p>معنی این کلمه چیست؟</p>
      <h3 style="text-align:center">${q.sv} <button class="btn secondary" style="font-size:0.8rem" onclick="currentWord='${q.sv}';speakWord()">🔊</button></h3>
      <div id="quizOptions"></div>
      <button class="btn secondary" style="margin-top:1rem" onclick="renderContent()">بازگشت</button>
    </div>
  `;
  const optsEl = document.getElementById('quizOptions');
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'quiz-option';
    btn.textContent = opt.fa;
    btn.onclick = () => {
      if (opt.sv === q.sv) {
        btn.classList.add('correct');
        addScore(10);
        setTimeout(() => startVocabQuiz(), 800);
      } else {
        btn.classList.add('wrong');
      }
    };
    optsEl.appendChild(btn);
  });
}

function startSentenceQuiz() {
  const sentences = [
    { sv: "Det råder bostadsbrist i storstäderna.", fa: "در شهرهای بزرگ کمبود مسکن وجود دارد." },
    { sv: "Bostäderna räcker inte till för alla.", fa: "مسکن‌ها برای همه کافی نیست." },
    { sv: "Vi har alltid prioriterat ett bra läge.", fa: "ما همیشه یک موقعیت خوب را اولویت داده‌ایم." },
    { sv: "Det tar fem minuter att ta sig till tunnelbanan.", fa: "پنج دقیقه طول می‌کشد تا به مترو برسیم." }
  ];
  const q = sentences[Math.floor(Math.random() * sentences.length)];
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="card">
      <h2>تمرین جمله</h2>
      <p>معنی این جمله چیست؟</p>
      <h3 style="text-align:center">${q.sv}</h3>
      <button class="btn secondary" onclick="currentWord='${q.sv}';speakWord()">🔊 گوش دادن به جمله</button>
      <div id="sentOptions" style="margin-top:1rem"></div>
      <button class="btn secondary" style="margin-top:1rem" onclick="renderContent()">بازگشت</button>
    </div>
  `;
  const opts = [q.fa, "مسکن در روستا ارزان است.", "جمعیت کم می‌شود.", "همه کار دارند."].sort(() => Math.random()-0.5);
  const el = document.getElementById('sentOptions');
  opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'quiz-option';
    btn.textContent = opt;
    btn.onclick = () => {
      if (opt === q.fa) {
        btn.classList.add('correct');
        addScore(12);
        setTimeout(() => startSentenceQuiz(), 900);
      } else btn.classList.add('wrong');
    };
    el.appendChild(btn);
  });
}

function renderGrammarQuiz() {
  const questions = [
    { q: "Vi har ________ bra utsikt.", answer: "en", options: ["en", "ett", "någon", "något"] },
    { q: "Jag kan inte sova med ________ oväsen.", answer: "detta", options: ["detta", "något", "inget", "allt"] },
    { q: "Han kommer från ett ________ land.", answer: "annat", options: ["annan", "annat", "andra", "allt"] },
    { q: "________ av dem har råd att köpa bostad.", answer: "Ingen", options: ["Ingen", "Någon", "Alla", "Annan"] }
  ];
  let html = '';
  questions.forEach((item, i) => {
    html += `<p><strong>${i+1}. ${item.q}</strong></p><div id="gq${i}"></div>`;
  });
  document.getElementById('grammarQuiz').innerHTML = html;
  questions.forEach((item, i) => {
    const div = document.getElementById('gq' + i);
    item.options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'quiz-option';
      btn.textContent = opt;
      btn.onclick = () => {
        if (opt.toLowerCase() === item.answer.toLowerCase()) {
          btn.classList.add('correct');
          addScore(8);
        } else {
          btn.classList.add('wrong');
        }
      };
      div.appendChild(btn);
    });
  });
}

function checkWriting() {
  const text = document.getElementById('writingArea').value.trim();
  const words = text.split(/\s+/).filter(w => w.length > 0).length;
  let fb = '';
  if (words < 70) {
    fb = `<p style="color:#e63946">تعداد کلمات کم است (${words}). حداقل ۸۰–۱۰۰ کلمه بنویسید.</p>`;
  } else {
    fb = `<p style="color:#2a9d8f">خوب است! (${words} کلمه). +15 امتیاز</p>`;
    addScore(15);
  }
  const hasGreeting = /hej|hallå/i.test(text);
  const hasClosing = /kram|hälsning|vänlig/i.test(text);
  const hasTips = /tips|tänk|kolla|planera/i.test(text);
  fb += `<ul>
    <li>${hasGreeting ? '✅' : '❌'} سلام (Hej)</li>
    <li>${hasClosing ? '✅' : '❌'} خداحافظی (Kram / hälsning)</li>
    <li>${hasTips ? '✅' : '❌'} نکات / tips</li>
  </ul>
  <p><small>برای بازخورد دقیق‌تر، نوشته را با همسرتان یا معلم بررسی کنید.</small></p>`;
  document.getElementById('writingFeedback').innerHTML = fb;
}

init();
</script>

<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SFI Dag</title>
<style>
body { font-family: system-ui, sans-serif; margin: 0; background: #f8f9fa; }
header { background: linear-gradient(135deg,#1d3557,#457b9d); color: white; padding: 1.2rem; text-align: center; }
.container { max-width: 800px; margin: 0 auto; padding: 1rem; }
.card { background: white; border-radius: 12px; padding: 1.5rem; margin: 1rem 0; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
button { background: #457b9d; color: white; border: none; padding: 0.6rem 1rem; border-radius: 8px; margin: 0.3rem; cursor: pointer; }
button.active { background: #e63946; }
</style>
</head>
<body>
<header>
  <h1>SFI Dag</h1>
  <div>امتیاز: 0 | پیشرفت: 0%</div>
</header>
<div class="container">
  <div id="weekNav"></div>
  <div id="dayTabs" style="margin:1rem 0;"></div>
  <div id="content" class="card">در حال بارگذاری...</div>
</div>
<script>
let currentWeek = 1;
let currentDay = 'mån';

function render() {
  const nav = document.getElementById('weekNav');
  nav.innerHTML = '';
  for (let i = 1; i <= 9; i++) {
    const b = document.createElement('button');
    b.textContent = 'Vecka ' + i;
    if (i === currentWeek) b.className = 'active';
    b.onclick = () => { currentWeek = i; currentDay = 'mån'; render(); };
    nav.appendChild(b);
  }

  const tabs = document.getElementById('dayTabs');
  tabs.innerHTML = '';
  [['mån','Mån'],['tis','Tis'],['ons','Ons'],['tors','Tors'],['fre','Fre']].forEach(([d,l]) => {
    const b = document.createElement('button');
    b.textContent = l;
    if (d === currentDay) b.className = 'active';
    b.onclick = () => { currentDay = d; render(); };
    tabs.appendChild(b);
  });

  document.getElementById('content').innerHTML = '<h2>Vecka ' + currentWeek + ' – ' + currentDay + '</h2><p>نسخه تست. اگر این را می‌بینی، صفحه درست کار می‌کند.</p><p>روی دکمه‌ها کلیک کن.</p>';
}
render();
</script>
</body>
</html>

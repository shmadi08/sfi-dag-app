<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SFI Dag</title>
<style>
:root { --primary:#e63946; --secondary:#457b9d; --bg:#f8f9fa; --card:#fff; --text:#1d3557; --success:#2a9d8f; }
* { box-sizing:border-box; }
body { font-family:system-ui,sans-serif; margin:0; background:var(--bg); color:var(--text); direction:ltr; }
header { background:linear-gradient(135deg,#1d3557,#457b9d); color:white; padding:1.2rem; text-align:center; }
header h1 { margin:0; font-size:1.6rem; }
.container { max-width:900px; margin:0 auto; padding:1rem; }
.nav { display:flex; gap:.5rem; flex-wrap:wrap; margin:1rem 0; justify-content:center; }
.nav button { background:white; border:2px solid var(--secondary); color:var(--secondary); padding:.5rem .9rem; border-radius:20px; cursor:pointer; font-weight:600; }
.nav button.active { background:var(--secondary); color:white; }
.day-tabs { display:flex; gap:.4rem; margin-bottom:1rem; overflow-x:auto; }
.day-tabs button { flex:1; min-width:70px; padding:.6rem; border:none; background:#e9ecef; border-radius:8px; cursor:pointer; }
.day-tabs button.active { background:var(--primary); color:white; }
.card { background:var(--card); border-radius:12px; padding:1.2rem; margin-bottom:1rem; box-shadow:0 2px 10px rgba(0,0,0,.08); }
.btn { background:var(--primary); color:white; border:none; padding:.55rem 1rem; border-radius:8px; cursor:pointer; margin:.2rem; }
.clickable-text span.word { cursor:pointer; border-bottom:1px dashed #ccc; }
.clickable-text span.word:hover { background:#fff3cd; }
.fa { direction:rtl; text-align:right; }
.score { font-size:.9rem; opacity:.9; }
</style>
</head>
<body>
<header>
  <h1>SFI Dag</h1>
  <div class="score" id="scoreDisplay">امتیاز: 0 | پیشرفت: 0%</div>
</header>
<div class="container">
  <div class="nav" id="weekNav"></div>
  <div class="day-tabs" id="dayTabs"></div>
  <div id="content"></div>
</div>
<script>
let currentWeek = 1;
let currentDay = 'mån';
let score = 0;

function makeClickable(text) {
  if (!text) return '';
  return text.split(/(\s+)/).map(part => {
    if (/^\s+$/.test(part)) return part;
    const clean = part.replace(/[.,!?;:"]/g, '');
    return '<span class="word" data-word="' + clean.toLowerCase() + '">' + part + '</span>';
  }).join('');
}

function renderWeekNav() {
  const nav = document.getElementById('weekNav');
  nav.innerHTML = '';
  for (let i = 1; i <= 9; i++) {
    const btn = document.createElement('button');
    btn.textContent = 'Vecka ' + i;
    if (i === currentWeek) btn.className = 'active';
    btn.onclick = () => { currentWeek = i; currentDay = 'mån'; renderWeekNav(); renderDayTabs(); renderContent(); };
    nav.appendChild(btn);
  }
}

function renderDayTabs() {
  const tabs = document.getElementById('dayTabs');
  tabs.innerHTML = '';
  [['mån','Mån'],['tis','Tis'],['ons','Ons'],['tors','Tors'],['fre','Fre']].forEach(([d,label]) => {
    const btn = document.createElement('button');
    btn.textContent = label;
    if (d === currentDay) btn.className = 'active';
    btn.onclick = () => { currentDay = d; renderDayTabs(); renderContent(); };
    tabs.appendChild(btn);
  });
}

function renderContent() {
  const content = document.getElementById('content');
  content.innerHTML = '<div class="card"><h2>Vecka ' + currentWeek + ' – ' + currentDay + '</h2><p class="clickable-text">' + makeClickable('Detta är en testversion. Klicka på orden. Fullständig innehåll kommer snart.') + '</p><p class="fa">این یک نسخه آزمایشی است. روی کلمات کلیک کنید.</p></div>';
  document.querySelectorAll('.clickable-text').forEach(el => {
    el.querySelectorAll('.word').forEach(span => {
      span.onclick = () => alert('کلمه: ' + span.dataset.word + '\nترجمه: (در نسخه کامل)');
    });
  });
}

function init() {
  try {
    renderWeekNav();
    renderDayTabs();
    renderContent();
  } catch(e) {
    document.getElementById('content').innerHTML = '<div class="card" style="color:red">خطا: ' + e.message + '</div>';
  }
}

init();
</script>
</body>
</html>

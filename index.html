<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SFI Dag</title>
<style>
:root { --primary:#e63946; --secondary:#457b9d; --bg:#f8f9fa; --card:#fff; --text:#1d3557; --success:#2a9d8f; }
* { box-sizing:border-box; }
body { font-family:system-ui,sans-serif; margin:0; background:var(--bg); color:var(--text); }
header { background:linear-gradient(135deg,#1d3557,#457b9d); color:white; padding:1.2rem; text-align:center; }
header h1 { margin:0; font-size:1.6rem; }
.container { max-width:900px; margin:0 auto; padding:1rem; }
.nav { display:flex; gap:.5rem; flex-wrap:wrap; margin:1rem 0; }
.nav button { background:white; border:2px solid var(--secondary); color:var(--secondary); padding:.5rem .9rem; border-radius:20px; cursor:pointer; font-weight:600; font-size:.9rem; }
.nav button.active { background:var(--secondary); color:white; }
.day-tabs { display:flex; gap:.4rem; margin-bottom:1rem; overflow-x:auto; }
.day-tabs button { flex:1; min-width:70px; padding:.6rem; border:none; background:#e9ecef; border-radius:8px; cursor:pointer; font-weight:500; }
.day-tabs button.active { background:var(--primary); color:white; }
.card { background:var(--card); border-radius:12px; padding:1.2rem; margin-bottom:1rem; box-shadow:0 2px 10px rgba(0,0,0,.08); }
.vocab-item { padding:.7rem; border-bottom:1px solid #eee; cursor:pointer; display:flex; justify-content:space-between; align-items:center; }
.vocab-item:hover { background:#f1f8ff; }
.vocab-word { font-weight:bold; }
.meanings { font-size:.85rem; color:#555; }
.popup { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:white; padding:1.5rem; border-radius:12px; box-shadow:0 10px 40px rgba(0,0,0,.25); z-index:1000; max-width:92%; width:400px; display:none; max-height:85vh; overflow-y:auto; }
.popup.show { display:block; }
.overlay { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:999; display:none; }
.overlay.show { display:block; }
.btn { background:var(--primary); color:white; border:none; padding:.55rem 1rem; border-radius:8px; cursor:pointer; font-size:.9rem; margin:.2rem; }
.btn.secondary { background:var(--secondary); }
.btn.success { background:var(--success); }
.clickable-text span.word { cursor:pointer; border-bottom:1px dashed #ccc; padding:0 1px; }
.clickable-text span.word:hover { background:#fff3cd; border-radius:3px; }
.flashcard { background:white; border-radius:12px; padding:2rem 1rem; text-align:center; min-height:200px; display:flex; flex-direction:column; justify-content:center; cursor:pointer; box-shadow:0 4px 15px rgba(0,0,0,.1); margin:1rem 0; }
.flashcard .front { font-size:1.8rem; font-weight:bold; }
.flashcard .back { display:none; }
.flashcard.flipped .front { display:none; }
.flashcard.flipped .back { display:block; }
.quiz-option { display:block; width:100%; text-align:left; margin:.4rem 0; padding:.7rem; border:2px solid #ddd; border-radius:8px; background:white; cursor:pointer; }
.quiz-option.correct { background:#d4edda; border-color:var(--success); }
.quiz-option.wrong { background:#f8d7da; border-color:var(--primary); }
.structure { background:#fff8e6; padding:1rem; border-radius:8px; margin:1rem 0; }
.model-answer { background:#f0f7ff; padding:1rem; border-radius:8px; margin:1rem 0; }
textarea { width:100%; min-height:140px; padding:.8rem; border:1px solid #ddd; border-radius:8px; font-family:inherit; }
.ipa { font-family:monospace; color:#666; font-size:.9rem; }
.ex-box { background:#f8f9fa; padding:.8rem; border-radius:8px; margin:.5rem 0; }
.score { font-size:.9rem; opacity:.9; }
</style>
</head>
<body>
<header>
  <h1>SFI Dag</h1>
  <div class="score" id="scoreDisplay">امتیاز: 0 | پیشرفت: 0%</div>
</header>
<div class="container">
  <div class="nav" id="weekNav"></div>
  <div class="day-tabs" id="dayTabs"></div>
  <div id="content"></div>
</div>
<div class="overlay" id="overlay" onclick="closePopup()"></div>
<div class="popup" id="popup">
  <h3 id="popWord"></h3>
  <p class="ipa" id="popIpa"></p>
  <p><strong>فارسی:</strong> <span id="popFa"></span></p>
  <p><strong>English:</strong> <span id="popEn"></span></p>
  <div class="ex-box" id="exBox" style="display:none">
    <p><strong>مثال:</strong> <span id="popEx" class="clickable-text"></span></p>
    <p><strong>فارسی مثال:</strong> <span id="popExFa"></span></p>
    <p><strong>English example:</strong> <span id="popExEn"></span></p>
  </div>
  <button class="btn" onclick="speakWord()">🔊 تلفظ</button>
  <button class="btn secondary" onclick="openWiktionary()">📖 Wiktionary</button>
  <button class="btn secondary" onclick="closePopup()">بستن</button>
</div>
<script>
const vocab = {
  mån: [
    {sv:"överens", fa:"موافق، هم‌نظر", en:"in agreement", ipa:"/ˈøːvəˌrɛns/", ex:"De flesta är överens.", exFa:"اکثر موافق هستند.", exEn:"Most people agree."},
    {sv:"råda", fa:"وجود داشتن", en:"to prevail", ipa:"/ˈroːda/", ex:"Det råder brist.", exFa:"کمبود وجود دارد.", exEn:"There is a shortage."},
    {sv:"brist", fa:"کمبود", en:"shortage", ipa:"/brɪst/", ex:"En brist på bostäder.", exFa:"کمبود مسکن.", exEn:"A shortage of housing."},
    {sv:"räcka", fa:"کافی بودن", en:"to be enough", ipa:"/ˈrɛka/", ex:"Det räcker inte.", exFa:"کافی نیست.", exEn:"It is not enough."},
    {sv:"inneboende", fa:"مستاجر", en:"lodger", ipa:"/ˈɪnəˌbuːəndə/", ex:"Han är inneboende.", exFa:"او مستاجر است.", exEn:"He is a lodger."},
    {sv:"befolkning", fa:"جمعیت", en:"population", ipa:"/bɛˈfɔlknɪŋ/", ex:"Befolkningen ökar.", exFa:"جمعیت افزایش می‌یابد.", exEn:"The population is increasing."},
    {sv:"ökning", fa:"افزایش", en:"increase", ipa:"/ˈøːknɪŋ/", ex:"En ökning.", exFa:"یک افزایش.", exEn:"An increase."},
    {sv:"boendekostnad", fa:"هزینه مسکن", en:"housing cost", ipa:"/ˈbuːəndɛˌkɔstnad/", ex:"Höga boendekostnader.", exFa:"هزینه‌های بالای مسکن.", exEn:"High housing costs."},
    {sv:"leda till", fa:"منجر شدن به", en:"to lead to", ipa:"/ˈleːda tɪl/", ex:"Det leder till problem.", exFa:"منجر به مشکل می‌شود.", exEn:"It leads to problems."},
    {sv:"ha råd", fa:"استطاعت داشتن", en:"to afford", ipa:"/ha roːd/", ex:"Har inte råd.", exFa:"استطاعت ندارد.", exEn:"Cannot afford."}
  ],
  tis: [
    {sv:"prioritera", fa:"اولویت دادن", en:"to prioritize", ipa:"/priɔrɪˈteːra/", ex:"Vi prioriterar läget.", exFa:"ما موقعیت را اولویت می‌دهیم.", exEn:"We prioritize the location."},
    {sv:"läge", fa:"موقعیت", en:"location", ipa:"/ˈlɛːɡɛ/", ex:"Ett bra läge.", exFa:"یک موقعیت خوب.", exEn:"A good location."},
    {sv:"utsikt", fa:"منظره", en:"view", ipa:"/ˈʉːtsɪkt/", ex:"Fin utsikt.", exFa:"منظره زیبا.", exEn:"Nice view."},
    {sv:"stenkast", fa:"فاصله خیلی کم", en:"stone's throw", ipa:"/ˈsteːnˌkast/", ex:"Ett stenkast.", exFa:"فاصله خیلی کم.", exEn:"A stone's throw."},
    {sv:"njuta", fa:"لذت بردن", en:"to enjoy", ipa:"/ˈnjʉːta/", ex:"Njuta av sällskapet.", exFa:"از همراهی لذت بردن.", exEn:"Enjoy the company."},
    {sv:"trångt", fa:"تنگ، شلوغ", en:"cramped", ipa:"/trɔŋt/", ex:"Det blir för trångt.", exFa:"خیلی تنگ می‌شود.", exEn:"It becomes too cramped."},
    {sv:"oväsen", fa:"سروصدا", en:"noise", ipa:"/ˈuːˌvɛːsən/", ex:"Allt oväsen.", exFa:"همه سروصدا.", exEn:"All the noise."},
    {sv:"slippa", fa:"معاف شدن از", en:"to avoid", ipa:"/ˈslɪpa/", ex:"Slippa tänka.", exFa:"از فکر کردن معاف شدن.", exEn:"Avoid thinking."}
  ]
};

const dictionary = {};
Object.keys(vocab).forEach(day => {
  vocab[day].forEach(v => {
    const key = v.sv.split(' ')[0].toLowerCase();
    dictionary[key] = v;
    dictionary[v.sv.toLowerCase()] = v;
  });
});
Object.assign(dictionary, {
  "flesta": {sv:"flesta", fa:"اکثر", en:"most", ipa:"/ˈflɛːsta/", ex:"De flesta.", exFa:"اکثر.", exEn:"Most."},
  "nog": {sv:"nog", fa:"احتمالاً", en:"probably", ipa:"/nuːɡ/", ex:"Är nog.", exFa:"احتمالاً است.", exEn:"Probably is."},
  "om": {sv:"om", fa:"در مورد", en:"about", ipa:"/ɔm/", ex:"Överens om.", exFa:"موافق در مورد.", exEn:"Agree about."},
  "att": {sv:"att", fa:"که / به", en:"that/to", ipa:"/at/", ex:"Att bo.", exFa:"زندگی کردن.", exEn:"To live."},
  "det": {sv:"det", fa:"آن", en:"it", ipa:"/deːt/", ex:"Det är.", exFa:"آن است.", exEn:"It is."},
  "är": {sv:"är", fa:"است", en:"is", ipa:"/ɛːr/", ex:"Det är bra.", exFa:"خوب است.", exEn:"It is good."},
  "och": {sv:"och", fa:"و", en:"and", ipa:"/ɔk/", ex:"Mamma och pappa.", exFa:"مامان و بابا.", exEn:"Mom and dad."},
  "en": {sv:"en", fa:"یک", en:"a", ipa:"/ɛn/", ex:"En lägenhet.", exFa:"یک آپارتمان.", exEn:"An apartment."},
  "i": {sv:"i", fa:"در", en:"in", ipa:"/iː/", ex:"I Stockholm.", exFa:"در استکهلم.", exEn:"In Stockholm."},
  "på": {sv:"på", fa:"روی", en:"on", ipa:"/poː/", ex:"På balkongen.", exFa:"روی بالکن.", exEn:"On the balcony."},
  "med": {sv:"med", fa:"با", en:"with", ipa:"/meːd/", ex:"Med vänner.", exFa:"با دوستان.", exEn:"With friends."},
  "för": {sv:"för", fa:"برای", en:"for", ipa:"/føːr/", ex:"För alla.", exFa:"برای همه.", exEn:"For everyone."},
  "som": {sv:"som", fa:"که", en:"that", ipa:"/sɔm/", ex:"Som bor.", exFa:"که زندگی می‌کند.", exEn:"That lives."},
  "till": {sv:"till", fa:"به", en:"to", ipa:"/tɪl/", ex:"Till tunnelbanan.", exFa:"به مترو.", exEn:"To the subway."},
  "har": {sv:"har", fa:"دارد", en:"has", ipa:"/hɑːr/", ex:"Vi har.", exFa:"ما داریم.", exEn:"We have."},
  "inte": {sv:"inte", fa:"نه", en:"not", ipa:"/ˈɪntɛ/", ex:"Inte tillräckligt.", exFa:"کافی نیست.", exEn:"Not enough."},
  "många": {sv:"många", fa:"خیلی‌ها", en:"many", ipa:"/ˈmɔŋa/", ex:"Många ungdomar.", exFa:"جوانان زیادی.", exEn:"Many young people."},
  "bo": {sv:"bo", fa:"زندگی کردن", en:"live", ipa:"/buː/", ex:"Vill bo.", exFa:"می‌خواهد زندگی کند.", exEn:"Wants to live."},
  "bostad": {sv:"bostad", fa:"مسکن", en:"housing", ipa:"/ˈbuːstɑːd/", ex:"Egen bostad.", exFa:"مسکن خود.", exEn:"Own home."},
  "lägenhet": {sv:"lägenhet", fa:"آپارتمان", en:"apartment", ipa:"/ˈlɛːɡənˌheːt/", ex:"En lägenhet.", exFa:"یک آپارتمان.", exEn:"An apartment."},
  "storstaden": {sv:"storstaden", fa:"شهر بزرگ", en:"big city", ipa:"/ˈstuːrˌstɑːdən/", ex:"I storstaden.", exFa:"در شهر بزرگ.", exEn:"In the big city."},
  "föräldrar": {sv:"föräldrar", fa:"والدین", en:"parents", ipa:"/ˈføːrˌɛldrar/", ex:"Hos föräldrar.", exFa:"نزد والدین.", exEn:"With parents."},
  "kompis": {sv:"kompis", fa:"دوست", en:"friend", ipa:"/ˈkɔmpɪs/", ex:"En kompis.", exFa:"یک دوست.", exEn:"A friend."},
  "jobb": {sv:"jobb", fa:"کار", en:"job", ipa:"/jɔb/", ex:"Hitta jobb.", exFa:"پیدا کردن کار.", exEn:"Find a job."},
  "dyr": {sv:"dyr", fa:"گران", en:"expensive", ipa:"/dyːr/", ex:"Det är dyrt.", exFa:"گران است.", exEn:"It is expensive."},
  "vill": {sv:"vill", fa:"می‌خواهد", en:"wants", ipa:"/vɪl/", ex:"Vill bo.", exFa:"می‌خواهد زندگی کند.", exEn:"Wants to live."},
  "bor": {sv:"bor", fa:"زندگی می‌کند", en:"lives", ipa:"/buːr/", ex:"Bor hemma.", exFa:"در خانه زندگی می‌کند.", exEn:"Lives at home."},
  "de": {sv:"de", fa:"آنها", en:"they", ipa:"/deː/", ex:"De flesta.", exFa:"اکثر آنها.", exEn:"Most of them."}
});

const texts = {
  mån: `De flesta är nog överens om att det råder bostadsbrist i Sveriges storstäder. Det är många som vill bo i storstaden och bostäderna räcker helt enkelt inte till för alla. Många ungdomar bor fortfarande kvar hos sina föräldrar och det är heller inte ovanligt att vara inneboende hos en kompis eller någon främmande person.\n\nByggföretagen bygger nya bostäder överallt, men ett problem verkar vara att byggandet inte går i takt med befolkningsökningen i städerna. Ett annat problem är att nyproducerade bostäder är dyra. Både priset på själva bostaden och boendekostnaderna är höga.\n\nBostadsbristen är som allra störst och mest påtaglig i innerstaden. Det är inte så konstigt, eftersom många av förklarliga skäl söker sig just dit.`,
  tis: `Jag heter Kim och bor tillsammans med min flickvän i en liten tvåa på 46 kvadratmeter i Stockholm. Vi har alltid prioriterat ett bra läge, så därför har vi accepterat att vi blir lite trångbodda. Vi har nära till allt. Det tar fem minuter att ta sig till tunnelbanan och vi har en fin utsikt från vår balkong.\n\nNackdelen med att bo centralt är att det är dyrt. Vår lägenhet kostade 3,5 miljoner. En annan nackdel är att bostaden är så liten att vi inte kan bjuda hem alla våra kompisar.`
};

let currentWeek = 1, currentDay = 'mån', currentWord = '', score = parseInt(localStorage.getItem('sfiScore')||'0'), learned = JSON.parse(localStorage.getItem('sfiLearned')||'[]');

function saveProgress() {
  localStorage.setItem('sfiScore', score);
  localStorage.setItem('sfiLearned', JSON.stringify(learned));
  updateScore();
}

function updateScore() {
  const total = Object.keys(dictionary).length;
  const pct = Math.round((learned.length / Math.max(total,1)) * 100);
  document.getElementById('scoreDisplay').textContent = 'امتیاز: ' + score + ' | پیشرفت: ' + pct + '%';
}

function init() {
  try {
    renderWeekNav();
    renderDayTabs();
    renderContent();
    updateScore();
  } catch(e) {
    document.getElementById('content').innerHTML = '<div class="card" style="color:red">خطا: ' + e.message + '</div>';
  }
}

function renderWeekNav() {
  const nav = document.getElementById('weekNav');
  nav.innerHTML = '';
  for (let i = 1; i <= 9; i++) {
    const btn = document.createElement('button');
    btn.textContent = 'Vecka ' + i;
    if (i === currentWeek) btn.className = 'active';
    btn.onclick = () => { currentWeek = i; currentDay = 'mån'; renderWeekNav(); renderDayTabs(); renderContent(); };
    nav.appendChild(btn);
  }
}

function renderDayTabs() {
  const tabs = document.getElementById('dayTabs');
  tabs.innerHTML = '';
  [['mån','Mån'],['tis','Tis'],['ons','Ons'],['tors','Tors'],['fre','Fre']].forEach(([d,label]) => {
    const btn = document.createElement('button');
    btn.textContent = label;
    if (d === currentDay) btn.className = 'active';
    btn.onclick = () => { currentDay = d; renderDayTabs(); renderContent(); };
    tabs.appendChild(btn);
  });
}

function makeClickable(text) {
  if (!text) return '';
  const parts = text.split(/(\s+)/);
  return parts.map(part => {
    const clean = part.replace(/[.,!?;:"“”]/g, '').toLowerCase();
    if (clean) {
      return '<span class="word" data-word="' + clean + '">' + part + '</span>';
    }
    return part;
  }).join('');
}

function attachClickHandlers(container) {
  if (!container) return;
  container.querySelectorAll('.word').forEach(span => {
    span.onclick = (e) => {
      e.stopPropagation();
      const key = span.dataset.word;
      handleWordClick(key);
    };
  });
}

function handleWordClick(key) {
  let entry = dictionary[key];
  if (entry) {
    showPopup(entry);
    if (!learned.includes(key)) {
      learned.push(key);
      score += 5;
      saveProgress();
    }
  } else {
    showPopup({sv:key, fa:"در حال جستجو...", en:"Searching...", ipa:"", ex:"", exFa:"", exEn:""});
    fetchMeaning(key).then(result => {
      if (result) {
        dictionary[key] = result;
        showPopup(result);
        if (!learned.includes(key)) {
          learned.push(key);
          score += 3;
          saveProgress();
        }
      } else {
        showPopup({sv:key, fa:"(یافت نشد — Wiktionary را بزنید)", en:"(not found — try Wiktionary)", ipa:"", ex:"", exFa:"", exEn:""});
      }
    });
  }
}

function renderContent() {
  const content = document.getElementById('content');
  if (currentWeek !== 1) {
    content.innerHTML = '<div class="card"><h2>Vecka ' + currentWeek + '</h2><p>محتوای این هفته به زودی اضافه می‌شود. فعلاً هفته ۱ کامل است.</p></div>';
    return;
  }
  if (currentDay === 'mån' || currentDay === 'tis') {
    content.innerHTML = `
      <div class="card">
        <h2>${currentDay === 'mån' ? 'Måndag' : 'Tisdag'} – Ordkunskap och läsning</h2>
        <h3>لغات جدید <button class="btn secondary" style="float:right" onclick="startFlashcards()">فلش‌کارت</button></h3>
        <div id="vocabList"></div>
        <h3 style="margin-top:1.5rem">متن خواندن (روی هر کلمه کلیک کنید)</h3>
        <div class="clickable-text" id="readingText"></div>
        <div style="margin-top:1rem">
          <a href="https://svenskadagfordag.se/ljud/ljud-svenska-dag-for-dag-d/vecka-1-d/" target="_blank" class="btn secondary">🎧 صوت رسمی</a>
          <button class="btn" onclick="startVocabQuiz()">تمرین لغات</button>
          <button class="btn success" onclick="startSentenceQuiz()">تمرین جمله</button>
        </div>
      </div>`;
    renderVocab();
    renderReading();
  } else if (currentDay === 'ons') {
    content.innerHTML = `
      <div class="card">
        <h2>Onsdag – Grammatik: Indefinita pronomen</h2>
        <div class="clickable-text" id="grammarText">
          <p>ضمایر نامعین برای بیان چیزی نامشخص درباره اشخاص یا اشیا استفاده می‌شوند.</p>
          <p>مثال: Vi har <span class="word" data-word="en">en</span> bra <span class="word" data-word="utsikt">utsikt</span>.</p>
          <p>مثال: <span class="word" data-word="ingen">Ingen</span> av dem har <span class="word" data-word="råd">råd</span>.</p>
        </div>
        <table style="width:100%;border-collapse:collapse;margin:1rem 0">
          <tr style="background:#f1f8ff"><th>En</th><th>Ett</th><th>Plural</th><th>Personer</th><th>Saker</th></tr>
          <tr><td>någon</td><td>något</td><td>några</td><td>någon</td><td>något</td></tr>
          <tr><td>ingen</td><td>inget</td><td>inga</td><td>ingen</td><td>inget</td></tr>
          <tr><td>annan</td><td>annat</td><td>andra</td><td>annan</td><td>annat</td></tr>
          <tr><td>all</td><td>allt</td><td>alla</td><td>alla</td><td>allt</td></tr>
        </table>
        <button class="btn" onclick="startGrammarQuiz()">تمرین گرامر</button>
      </div>`;
    attachClickHandlers(document.getElementById('grammarText'));
  } else if (currentDay === 'tors') {
    content.innerHTML = `
      <div class="card">
        <h2>Torsdag – Skrivövning</h2>
        <div class="structure clickable-text" id="structureText">
          <strong>ساختار نامه خوب:</strong>
          <ol>
            <li><b>Hälsning:</b> Hej / Hej [namn]!</li>
            <li><b>Inledning:</b> Tack för brevet + gratulera</li>
            <li><b>Huvuddel:</b> پاسخ به سوالات</li>
            <li><b>Avslutning:</b> Hoppas du trivs + Kram</li>
          </ol>
        </div>
        <div class="model-answer clickable-text" id="modelText">
          <strong>نمونه:</strong><br>
          Hej min vän!<br><br>
          Tack så mycket för ditt brev och stort grattis till den nya bostaden! När jag flyttade planerade jag allt noga. Mitt bästa tips är att kolla hur nära det är till kollektivtrafik. Området är trevligt men ganska dyrt. Jag hoppas att du trivs!<br><br>
          Kram<br>Din vän
        </div>
        <p>حالا خودتان بنویسید (حداقل ۸۰ کلمه):</p>
        <textarea id="writingArea" placeholder="Skriv ditt svar här..."></textarea>
        <button class="btn" style="margin-top:.8rem" onclick="checkWriting()">بررسی نوشته</button>
        <div id="writingFeedback"></div>
      </div>`;
    attachClickHandlers(document.getElementById('structureText'));
    attachClickHandlers(document.getElementById('modelText'));
  } else {
    content.innerHTML = `
      <div class="card">

function renderVocab() {
  const list = document.getElementById('vocabList');
  if (!list) return;
  list.innerHTML = '';
  (vocab[currentDay] || []).forEach(v => {
    const div = document.createElement('div');
    div.className = 'vocab-item';
    const learnedMark = learned.includes(v.sv.toLowerCase()) ? ' ✓' : '';
    div.innerHTML = '<div><div class="vocab-word">' + v.sv + learnedMark + '</div><div class="meanings">' + v.fa + ' | ' + v.en + '</div></div><span>▶</span>';
    div.onclick = () => showPopup(v);
    list.appendChild(div);
  });
}

function renderReading() {
  const el = document.getElementById('readingText');
  if (!el) return;
  const text = texts[currentDay] || '';
  el.innerHTML = makeClickable(text).replace(/\n/g, '<br>');
  attachClickHandlers(el);
}

async function fetchMeaning(word) {
  if (!word) return null;
  try {
    const resEn = await fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(word) + '&langpair=sv|en');
    const dataEn = await resEn.json();
    const en = dataEn?.responseData?.translatedText || '';
    let fa = '';
    if (en && en.toLowerCase() !== word.toLowerCase()) {
      const resFa = await fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(en) + '&langpair=en|fa');
      const dataFa = await resFa.json();
      fa = dataFa?.responseData?.translatedText || '';
    }
    if (en || fa) {
      return { sv: word, fa: fa || '(ترجمه خودکار)', en: en || '(auto)', ipa: '', ex: '', exFa: '', exEn: '' };
    }
  } catch(e) {}
  return null;
}

function showPopup(v) {
  currentWord = v.sv || '';
  document.getElementById('popWord').textContent = v.sv || '';
  document.getElementById('popIpa').textContent = v.ipa || '';
  document.getElementById('popFa').textContent = v.fa || '';
  document.getElementById('popEn').textContent = v.en || '';
  const exBox = document.getElementById('exBox');
  if (v.ex) {
    exBox.style.display = 'block';
    document.getElementById('popEx').innerHTML = makeClickable(v.ex);
    document.getElementById('popExFa').textContent = v.exFa || '';
    document.getElementById('popExEn').textContent = v.exEn || '';
    attachClickHandlers(document.getElementById('popEx'));
  } else {
    exBox.style.display = 'none';
  }
  document.getElementById('popup').classList.add('show');
  document.getElementById('overlay').classList.add('show');
}

function closePopup() {
  document.getElementById('popup').classList.remove('show');
  document.getElementById('overlay').classList.remove('show');
}

function speakWord() {
  if (!currentWord) return;
  const utter = new SpeechSynthesisUtterance(currentWord);
  utter.lang = 'sv-SE';
  utter.rate = 0.7;
  const voices = speechSynthesis.getVoices();
  const sv = voices.find(v => v.lang.startsWith('sv'));
  if (sv) utter.voice = sv;
  speechSynthesis.speak(utter);
}

function openWiktionary() {
  if (!currentWord) return;
  window.open('https://sv.wiktionary.org/wiki/' + encodeURIComponent(currentWord.split(' ')[0]), '_blank');
}

let flashIndex = 0, flashCards = [];
function startFlashcards() {
  flashCards = [...(vocab[currentDay] || [])];
  flashIndex = 0;
  document.getElementById('content').innerHTML = `
    <div class="card">
      <h2>فلش‌کارت</h2>
      <div class="flashcard" id="flashcard" onclick="flipCard()">
        <div class="front" id="flashFront"></div>
        <div class="back" id="flashBack"></div>
      </div>
      <div style="text-align:center">
        <button class="btn" onclick="speakWord()">🔊 تلفظ</button>
        <button class="btn secondary" onclick="nextFlash(-1)">قبلی</button>
        <button class="btn" onclick="nextFlash(1)">بعدی</button>
      </div>
      <p id="flashProgress" style="text-align:center"></p>
      <button class="btn secondary" onclick="renderContent()">بازگشت</button>
    </div>`;
  showFlash();
}

function showFlash() {
  if (!flashCards.length) return;
  if (flashIndex >= flashCards.length) flashIndex = 0;
  if (flashIndex < 0) flashIndex = flashCards.length - 1;
  const v = flashCards[flashIndex];
  document.getElementById('flashFront').textContent = v.sv;
  document.getElementById('flashBack').innerHTML = '<strong>' + v.fa + '</strong><br>' + v.en + '<br><span class="ipa">' + (v.ipa||'') + '</span><br><div class="clickable-text">' + makeClickable(v.ex||'') + '</div><br><small>' + (v.exFa||'') + '</small><br><small>' + (v.exEn||'') + '</small>';
  attachClickHandlers(document.getElementById('flashBack'));
  document.getElementById('flashcard').classList.remove('flipped');
  document.getElementById('flashProgress').textContent = (flashIndex+1) + ' / ' + flashCards.length;
  currentWord = v.sv;
}

function flipCard() { document.getElementById('flashcard').classList.toggle('flipped'); }
function nextFlash(d) { flashIndex += d; showFlash(); }

function startVocabQuiz() {
  const items = vocab[currentDay] || [];
  if (!items.length) return;
  const q = items[Math.floor(Math.random()*items.length)];
  const opts = [q];
  while (opts.length < Math.min(4, items.length)) {
    const r = items[Math.floor(Math.random()*items.length)];
    if (!opts.find(o => o.sv === r.sv)) opts.push(r);
  }
  opts.sort(() => Math.random()-0.5);
  document.getElementById('content').innerHTML = `
    <div class="card">
      <h2>تمرین لغات</h2>
      <p>معنی این کلمه چیست؟</p>
      <h3 style="text-align:center">${q.sv} <button class="btn secondary" onclick="currentWord='${q.sv}';speakWord()">🔊</button></h3>
      <div id="quizOptions"></div>
      <button class="btn secondary" style="margin-top:1rem" onclick="renderContent()">بازگشت</button>
    </div>`;
  const el = document.getElementById('quizOptions');
  opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'quiz-option';
    btn.textContent = opt.fa;
    btn.onclick = () => {
      if (opt.sv === q.sv) { 
        btn.classList.add('correct'); 
        score += 10;
        saveProgress();
        setTimeout(startVocabQuiz, 700); 
      }
      else btn.classList.add('wrong');
    };
    el.appendChild(btn);
  });
}

function checkWriting() {
  const text = document.getElementById('writingArea').value.trim();
  const words = text.split(/\s+/).filter(w => w).length;
  let fb = words < 50 ? '<p style="color:#e63946">تعداد کلمات کم است (' + words + '). حداقل ۸۰ کلمه بنویسید.</p>'
                       : '<p style="color:#2a9d8f">خوب است! (' + words + ' کلمه) +۲۰ امتیاز</p>';
  if (words >= 50) { score += 20; saveProgress(); }
  fb += '<ul><li>' + (/hej/i.test(text)?'✅':'❌') + ' سلام (Hej)</li>';
  fb += '<li>' + (/kram|hälsning/i.test(text)?'✅':'❌') + ' خداحافظی</li></ul>';
  document.getElementById('writingFeedback').innerHTML = fb;
}
